<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Dynamic Quiz Generator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.5; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 20px; margin-bottom: 15px; }
    input, button, select { width: 100%; padding: 10px; margin-top: 8px; box-sizing: border-box; }
    button { background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0052a3; }
    .hidden { display: none; }
    .option-btn { background: #f0f0f0; color: #333; margin: 5px 0; text-align: left; }
    .correct { background: #d4edda; border: 1px solid #c3e6cb; }
    .incorrect { background: #f8d7da; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

  <h1>⚡ AI Quiz Generator</h1>
  
  <!-- Setup Screen -->
  <div id="setup-screen" class="card">
    <label><b>1. Enter your Gemini API Key:</b></label>
    <input type="password" id="api-key" placeholder="AIzaSy..." />
    <small>Get a free key from <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a>. Saved locally in browser.</small>
    <br><br>
    
    <label><b>2. Quiz Topic:</b></label>
    <input type="text" id="topic" value="Solar System & Astronomy" />
    
    <button id="start-btn" onclick="generateQuiz()">Generate Fresh Quiz</button>
  </div>

  <!-- Loading State -->
  <div id="loading" class="card hidden">
    <h3>🤖 Generating questions on the fly...</h3>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen" class="hidden"></div>

  <script>
    // Load saved API Key if present
    document.getElementById('api-key').value = localStorage.getItem('gemini_key') || '';

    async function generateQuiz() {
      const apiKey = document.getElementById('api-key').value.trim();
      const topic = document.getElementById('topic').value.trim();

      if (!apiKey || !topic) return alert('Please provide both an API key and a topic.');
      
      // Save key locally
      localStorage.setItem('gemini_key', apiKey);

      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('loading').classList.remove('hidden');

      const prompt = `Generate 3 multiple choice questions about "${topic}". 
      Return ONLY a JSON array with this exact format, no Markdown wrapping, no text before or after:
      [
        {
          "question": "Question text?",
          "options": ["Opt A", "Opt B", "Opt C", "Opt D"],
          "answer": 0,
          "explanation": "Why option 0 is correct."
        }
      ]`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        const questions = JSON.parse(rawText);

        renderQuiz(questions);
      } catch (err) {
        alert('Failed to generate quiz. Please check your API key.');
        document.getElementById('setup-screen').classList.remove('hidden');
      } finally {
        document.getElementById('loading').classList.add('hidden');
      }
    }

    function renderQuiz(questions) {
      const quizContainer = document.getElementById('quiz-screen');
      quizContainer.innerHTML = '<h2>Your Quiz</h2>';
      quizContainer.classList.remove('hidden');

      questions.forEach((q, qIndex) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<p><b>Q${qIndex + 1}: ${q.question}</b></p>`;

        q.options.forEach((opt, optIndex) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerText = opt;
          btn.onclick = () => {
            const allBtns = card.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);
            
            if (optIndex === q.answer) {
              btn.classList.add('correct');
            } else {
              btn.classList.add('incorrect');
              allBtns[q.answer].classList.add('correct');
            }
            
            const exp = document.createElement('p');
            exp.innerHTML = `<small><b>Explanation:</b> ${q.explanation}</small>`;
            card.appendChild(exp);
          };
          card.appendChild(btn);
        });

        quizContainer.appendChild(card);
      });

      const resetBtn = document.createElement('button');
      resetBtn.innerText = '🔄 Generate Another Set';
      resetBtn.onclick = () => location.reload();
      quizContainer.appendChild(resetBtn);
    }
  </script>
</body>
</html>
